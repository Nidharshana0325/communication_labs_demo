function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

p.list=h.length>1?h.slice(0,-1).join(', ')+' and '+h[h.length-1]:h[0];p.h1=h[0];p.why=w[h[0]]||'it is fun';p.inter=C.get('level','basic')=='inter';return p}

function save(k,v){var p=C.get('profile',{});p[k]=v;C.set('profile',p)}

function parts(){var p=prof(),i=p.inter;return['Good morning, everyone. My name is '+p.name+'.','I am '+p.age+' years old. I am from '+p.town+'.'+(i?' I am new in this class.':''),'I like '+p.list+'.'+(i?' I like '+p.h1+' because '+p.why+'.':'')+' Nice to meet you. Thank you.']}

var b=f.length>=clear?0:f.length>=2?1:2;return{band:b,lines:b?[f.length?D.idea[f[0]][0]:'Good try. Say a little more.',D.idea[m[0]][1]]:['Well done. Your answer is correct.']}}

function skillStep(b,S){speak(b,S,[{who:'Mr Singh',ask:'Please tell me about yourself.',clue:'Say as much as you can.',any:1,free:function(t){var p=prof();return freeCheck(t,['greet','name','age','town','like','meet'],p.inter?5:4)},onres:function(r){var a=C.get('skill',[]);a.push(r.band);C.set('skill',a.slice(-10))}}])}
function canStep(b){var r=C.get('rate',{});b.innerHTML=D.can.map(function(x,i){return'<div class="cl-card"><p><strong>'+esc(x)+'</strong></p><div class="cl-chips" id="cl-exp01-r'+i+'"></div></div>'}).join('');
D.can.forEach(function(x,i){pick(C.$('r'+i),['Not yet','Almost','Yes'].map(function(y){return{k:y,t:y}}),r[i]?[r[i]]:[],1,function(s){r[i]=s[0];C.set('rate',r)})})}
function endStep(b){b.innerHTML='<div class="cl-row">'+badge()+'<div><p><strong>Meet and Greet</strong></p><p>Skill check: <strong>'+mastery()+'</strong></p></div></div><div class="cl-card"><strong>Use it today</strong><p>Say hello to one new person. Say your name.</p><p>Practise again tomorrow.</p></div>'}

var STEPS=[
{stage:0,title:'Meet and Greet',line:'Press Start.',render:function(b,S){S.pic(scene());b.innerHTML='<p>You are the new student in a class.</p>'+C.audio('Welcome. Today you will meet a new class.')}},
{stage:1,title:'A new student',line:'Look at the picture.',render:function(b,S){S.pic(scene());b.innerHTML='<p>You are the new student. Kavya and Mr Singh say hello.</p>'+C.audio('Today you will learn to introduce yourself.')}},
{stage:1,title:'Why we need this',line:'Read the text.',render:function(b){var t=['In a new class.','With a new neighbour.','At a camp.'];b.innerHTML='<p>We introduce ourselves in many places.</p><div class="cl-three">'+t.map(function(x,i){return'<div class="cl-card">'+useSvg(i)+'<p>'+x+'</p></div>'}).join('')+'</div>'}},
{stage:1,title:'Our plan',line:'Choose one answer.',gate:1,hint:'Choose a level to go on.',render:plan},
{stage:2,title:'Key phrases',line:'Tap Play on each card.',gate:1,hint:'Play all 5 cards to go on.',how:'tap',render:learn},
{stage:3,title:'The sound th',line:'Watch the mouth.',render:mouthStep},
{stage:3,title:'Say thank you',line:'Say the sentence aloud.',gate:1,hint:'Say or type the sentence to go on.',how:'say',render:function(b,S){speak(b,S,[{say:'Thank you.',conf:D.conf,pic:'<p class="cl-note">Tip: put your tongue tip between your teeth for th.</p>'},{say:'Thank you, Mr Singh.',conf:D.conf,skip:'mr singh'}])}},
{stage:4,title:'Your name',line:'Type your answer.',gate:1,hint:'Save your name to go on.',how:'type',render:nameStep},
{stage:4,title:'Your age',line:'Choose one answer.',gate:1,hint:'Choose your age to go on.',render:ageStep},
{stage:4,title:'Your town',line:'Choose one answer.',gate:1,hint:'Choose or type your town.',render:townStep},
{stage:4,title:'Your hobbies',line:'Choose two or three answers.',gate:1,hint:'Choose two or three hobbies.',render:hobbyStep},
{stage:4,title:'Your introduction',line:'Read the text.',render:introStep},
{stage:4,title:'Build your sentences',line:'Tap the words in the correct order.',gate:1,hint:'Put both sentences in order.',how:'order',render:function(b,S){order(b,S,['I am {age} years old.','I am from {town}.'])}},
{stage:4,title:'My, your, her, his',line:'Choose one answer.',gate:1,hint:'Answer all 3 questions to go on.',render:function(b,S){quiz(b,S,D.poss)}},
{stage:5,title:'Choose the kinder reply',line:'Choose the kinder sentence.',gate:1,hint:'Answer all 3 questions to go on.',render:function(b,S){quiz(b,S,D.kind)}},
{stage:6,title:'Situation 1: Your introduction',line:'Say the sentence aloud.',gate:1,hint:'Say all 3 parts to go on.',render:function(b,S){speak(b,S,parts().map(function(t,k){return{say:t,skip:'{name} {town} {age}',pic:k?'':scene()+'<p>Mr Singh says: "Please tell us about yourself."</p>'}}))}},
{stage:6,title:'Situation 2: Questions from Kavya',line:'Say your answer.',gate:1,hint:'Answer all 3 questions to go on.',render:function(b,S){speak(b,S,D.Q[prof().inter?'inter':'basic'].map(function(x){return{ask:x.ask,say:x.say,skip:x.skip,bad:x.bad,who:'Kavya'}}))}},
{stage:6,title:"Situation 3: Kavya's mother",line:'Say your answer.',gate:1,hint:'Say your answer to go on.',render:function(b,S){speak(b,S,[{who:"Kavya's mother",ask:'Good afternoon. You must be the new student. What is your name?',clue:prof().inter?'Clues: a greeting, your name, your town, a kind end.':'Clues: a greeting, your name, a kind end.',pic:gate(),free:function(t){var k=prof().inter?['greet','name','town','meet']:['greet','name','meet'];return freeCheck(t,k,k.length)}}])}},
{stage:7,title:'Skill check',line:'Do this task on your own.',gate:1,hint:'Try the task once to go on.',render:skillStep},
{stage:8,title:'Key sentences',line:'Listen to the sentence.',render:function(b){b.innerHTML='<p>Today you learned to introduce yourself and answer questions.</p>'+['Good morning, everyone.','My name is {name}.','I am {age} years old. I am from {town}.','I like {list}.','Nice to meet you. Thank you.'].map(function(x){return'<div class="cl-card">'+C.audio(T(x))+'</div>'}).join('')}},
{stage:8,title:'I can',line:'Check what you can do now.',render:canStep},
{stage:8,title:'Your badge',line:'Read the text.',next:'Finish',render:endStep}];

document.addEventListener('DOMContentLoaded',function(){CLab.run({id:'exp01',label:'Experiment 1 of 15',welcome:'Welcome to Meet and Greet.',steps:STEPS})});
